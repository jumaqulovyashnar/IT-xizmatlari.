version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: it_services_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-it_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-it_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-it_services_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - it_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-it_admin} -d ${POSTGRES_DB:-it_services_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Caching & Queues
  redis:
    image: redis:7-alpine
    container_name: it_services_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - it_network

  # 3. MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: it_services_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minio_secret_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - it_network

  # 4. Backend API (NestJS)
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: it_services_backend
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-it_admin}:${POSTGRES_PASSWORD:-it_secret_pass}@postgres:5432/${POSTGRES_DB:-it_services_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 4000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "4000:4000"
    networks:
      - it_network

  # 5. Frontend App (Next.js)
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: it_services_frontend
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - it_network

  # 6. Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: it_services_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - it_network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  it_network:
    driver: bridge
